name: XIV Pipeline

on:
  schedule:
    - cron: "0 * * * *"   # runs every hour
  workflow_dispatch:      # allows manual runs

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies (robust)
        run: |
          python -m pip install -r requirements.txt || python -m pip install requests pandas sqlalchemy psycopg2-binary

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python main.py
          
